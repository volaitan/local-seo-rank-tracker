[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-seo-rank-tracker"
version = "1.0.0"
description = "Track local Google rankings across a geo-grid, plus reviews and competitors, with client-ready HTML reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Victor Olaitan" }]
dependencies = ["requests>=2.31", "Jinja2>=3.1", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rank-tracker = "rank_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rank_tracker = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
